name: Metrics
on:
  # Schedule daily updates at midnight and midday UTC
  schedule: [{cron: "0 0,12 * * *"}]
  # Allow manual trigger via GitHub Actions UI
  workflow_dispatch:
  # Run on push to main
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Base Metrics Overview
      - name: General Profile Overview
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.base.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Nishant-031-coder
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4

      # 2. Isometric 3D Commit Calendar
      - name: Isometric Commit Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.plugin.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Nishant-031-coder
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 3. Programming Languages Breakdown
      - name: Languages Breakdown
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.plugin.languages.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Nishant-031-coder
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_details: yes
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

      # 4. GitHub Achievements & Badges
      - name: GitHub Achievements
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.plugin.achievements.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Nishant-031-coder
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

      # 5. Coding Habits & Rhythm
      - name: Coding Habits & Rhythm
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.plugin.habits.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Nishant-031-coder
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          config_timezone: Asia/Kolkata
