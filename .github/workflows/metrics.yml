name: Metrics
on:
  # Schedule updates every 12 hours
  schedule: [{cron: "0 0,12 * * *"}]
  # Lines below allow the workflow to be run manually and on push to main
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Classic Metrics (Header, Activity, Community, Repositories)
      - name: Classic Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.classic.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Nishant-031-coder
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_lines: yes

      # Isometric commit calendar - Full Year
      - name: Full Year Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Nishant-031-coder
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Isometric commit calendar - Half Year
      - name: Half Year Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.plugin.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Nishant-031-coder
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # Languages Activity - Details
      - name: Languages Details
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.plugin.languages.details.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Nishant-031-coder
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_details: yes
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

      # Languages Activity - Recently used
      - name: Languages Recent
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.plugin.languages.recent.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Nishant-031-coder
          base: ""
          plugin_languages: yes
          plugin_languages_sections: recently-used
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300

      # Coding Habits - Charts
      - name: Habits Charts
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.plugin.habits.charts.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Nishant-031-coder
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          config_timezone: Asia/Kolkata

      # Coding Habits - Facts
      - name: Habits Facts
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.plugin.habits.facts.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Nishant-031-coder
          base: ""
          plugin_habits: yes
          plugin_habits_facts: yes
          config_timezone: Asia/Kolkata

      # Achievements
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.plugin.achievements.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Nishant-031-coder
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
